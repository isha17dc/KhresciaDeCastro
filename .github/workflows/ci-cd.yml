name: Deploy Ionic App Locally

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run automated tests
        run: npm test --if-present

      - name: Build application
        run: npm run build -- --configuration development

  deploy:
    needs: continuous-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        run: docker build -t ionic-crud:latest .

      - name: Remove previous container
        run: docker rm -f ionic-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 ionic-crud:latest

      - name: Verify app
        shell: pwsh
        run: |
          $success = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $resp = Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 5
              if ($resp.StatusCode -eq 200) {
                $success = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }
